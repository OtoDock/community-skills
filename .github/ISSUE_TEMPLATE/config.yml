blank_issues_enabled: false
contact_links:
  - name: Question or help with an install
    url: https://github.com/OtoDock/oto-dock/discussions/categories/q-a
    about: Ask in the platform's Discussions. Bug reports and proposals for catalog entries stay here as issues.
  - name: Bug in the OtoDock platform
    url: https://github.com/OtoDock/oto-dock/issues/new/choose
    about: The proxy, the dashboard, remote machines and the phone service live in the platform repository.
  - name: Security vulnerability
    url: https://github.com/OtoDock/community-skills/security/advisories/new
    about: Report it privately. Skills run with the agent's own permissions, so a malicious one is a supply-chain problem; SECURITY.md has the scope.
